<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Checkout - Hidrocromo Mágico</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body class="bg-dark text-white">

<div class="container py-5">

    <h1 class="mb-4 fw-bold text-info">
        Finalizar Compra
    </h1>

    <div class="row">

        <div class="col-md-7">

            <form>

                <div class="mb-3">
                    <label class="form-label">Nombre Completo</label>
                    <input type="text" class="form-control bg-secondary text-white border-0">
                </div>

                <div class="mb-3">
                    <label class="form-label">Correo Electrónico</label>
                    <input type="email" class="form-control bg-secondary text-white border-0">
                </div>

                <div class="mb-3">
                    <label class="form-label">Dirección</label>
                    <input type="text" class="form-control bg-secondary text-white border-0">
                </div>

                <div class="mb-3">
                    <label class="form-label">País</label>
                    <input type="text" class="form-control bg-secondary text-white border-0">
                </div>

            </form>

        </div>

        <div class="col-md-5">

            <div class="card bg-secondary text-white border-0 shadow">

                <div class="card-body">

                    <h3 class="fw-bold">
                        Resumen del Pedido
                    </h3>

                    <ul id="checkout-items" class="list-group mb-3">
                        </ul>

                    <h4>
                        Total: $<span id="checkout-total">0</span>
                    </h4>

                    <button class="btn btn-success w-100 mt-3 fw-bold py-2">
                        Proceder al Pago
                    </button>

                </div>

            </div>

        </div>

    </div>

</div>

<script src="js/checkout.js"></script>

</body>
</html>
